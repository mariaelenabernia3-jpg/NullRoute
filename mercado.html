<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mercado Galáctico // GalaxyGens</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="lobby.webp" type="image/webp" fetchpriority="high">
<link rel="stylesheet" href="galaxy.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.market-header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  width: 100%;
  margin-bottom: 20px;
}
.shops-directory-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
  width: 100%;
}
.shop-portal-card {
  background: var(--p);
  border: 2px solid var(--p2);
  border-radius: 8px;
  padding: 18px 16px;
  text-align: left;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: 0 0 15px rgba(0,0,0,0.6);
  position: relative;
  transition: transform .15s ease, border-color .15s ease;
}
.shop-portal-card:hover {
  transform: translateY(-2px);
}
.shop-portal-card.mine {
  border-color: var(--g);
  box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
}
.badge-mine {
  position: absolute;
  top: 12px;
  right: 12px;
  background: var(--g);
  color: #030b1e;
  font: 8px 'Press Start 2P', monospace;
  padding: 3px 6px;
  border-radius: 4px;
}
</style>
</head>
<body>
<script src="galaxy.js"></script>
<script>
let M_DIR = null;

startPage({active:'mercado.html', needPlanet:true}).then(() => {
  loadDirectory();
  setInterval(loadDirectory, 8000);
});

$('view').innerHTML = `
  <div class="market-header-bar">
    <div>
      <h2 class="sec-title px" style="margin:0">🏪 MERCADO DEL SECTOR</h2>
      <div id="slotsTxt" style="font-size:10px;color:var(--m);margin-top:4px">Cargando espacios...</div>
    </div>
    <div id="createShopArea"></div>
  </div>
  <div class="notice" style="width:100%;margin-bottom:16px;font-size:9.5px">
    🪐 Solo puede existir <b>1 tienda por planeta</b>. Comercia minerales de reactores con otros comandantes.
  </div>
  <div class="shops-directory-grid" id="shopsGrid"></div>`;

async function loadDirectory(){
  if (document.hidden) return;
  try {
    const { data } = await db.rpc('galaxy_market_get_directory', { p_user_id: me.id });
    if (!data || !data.success) return;
    await addWandSlots(data);
    M_DIR = data;
    renderDirectory();
  } catch(e) {
    console.error('Error al cargar mercado:', e);
  }
}

// Las varitas viven en galaxy_wand_listings (tabla propia). Sumamos las
// publicaciones activas del jugador para que el contador de espacios sea real.
async function addWandSlots(d){
  const myShop = (d.shops || []).find(s => s.is_my_planet);
  if (!myShop) return;
  try {
    const { data } = await db.rpc('galaxy_wand_shop_listings', {
      p_user_id: me.id,
      p_session_hash: SESSION_HASH,
      p_shop_id: myShop.id
    });
    if (data && data.success && Array.isArray(data.listings)) {
      const mine = data.listings.filter(l => l.is_mine).length;
      d.my_slots_used = Number(d.my_slots_used || 0) + mine;
    }
  } catch(e) {}
}

function renderDirectory(){
  const d = M_DIR;
  $('slotsTxt').innerHTML = `Tus espacios de mercado activos: <b style="color:var(--gold)">${d.my_slots_used} / ${d.my_slots_max}</b>`;

  const myPlanetShop = (d.shops || []).find(s => s.is_my_planet);
  const btnArea = $('createShopArea');

  if (!myPlanetShop) {
    btnArea.innerHTML = `<button class="btn ok sm" onclick="foundShop()">✨ Fundar Tienda de Mi Planeta</button>`;
  } else {
    btnArea.innerHTML = `<a class="btn sm" href="tienda.html?id=${myPlanetShop.id}">⚙️ Mi Tienda Planetaria</a>`;
  }

  const grid = $('shopsGrid');
  if (!d.shops || !d.shops.length) {
    grid.innerHTML = `<div class="box" style="grid-column:1/-1"><p style="color:var(--m)">No hay tiendas fundadas en el cuadrante aún.</p></div>`;
    return;
  }

  grid.innerHTML = d.shops.map(s => `
    <div class="shop-portal-card ${s.is_my_planet ? 'mine' : ''}" style="border-left: 4px solid ${s.theme_color}">
      ${s.is_my_planet ? '<span class="badge-mine">TU PLANETA</span>' : ''}
      <div>
        <h3 class="px" style="font-size:12px;color:${s.theme_color};margin:0 0 6px">${esc(s.name)}</h3>
        <p style="font-size:11px;color:var(--m);margin:0 0 10px;line-height:1.4">${esc(s.slogan)}</p>
        <div style="font-size:10px;color:var(--t);margin-bottom:8px">
          🪐 Colonia: <b>${esc(s.planet_name)}</b>
        </div>
        <div style="font:9px 'Press Start 2P', monospace;color:var(--gold);margin-bottom:14px">
          📦 ${s.active_chests} Cofre${s.active_chests===1?'':'s'} en Stock
        </div>
      </div>
      <a class="btn ok" style="text-align:center;text-decoration:none" href="tienda.html?id=${s.id}">
        ACCEDER A LA TIENDA 🚀
      </a>
    </div>`).join('');
}

async function foundShop(){
  const name = prompt('Nombre de la tienda de tu planeta:', 'Emporio ' + (state.planet ? state.planet.name : 'Estelar'));
  if (!name || !name.trim()) return;

  const { data, error } = await db.rpc('galaxy_shop_save', {
    p_user_id: me.id,
    p_name: name.trim(),
    p_slogan: 'Los mejores suministros minerales',
    p_theme_color: '#00f2fe',
    p_banner_url: 'preset_nebula'
  });

  if (error || !data || !data.success) return toast('❌ ' + (data ? data.msg : 'Error al fundar'));
  toast('🎉 ¡Tienda fundada con éxito!');
  loadDirectory();
}
</script>
</body>
</html>
