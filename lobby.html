<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lobby // GalaxyGens</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="lobby.webp" type="image/webp" fetchpriority="high">
<link rel="stylesheet" href="galaxy.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.chest-btn-open {
  margin-top: 10px;
  width: 100%;
  font-size: 8px;
  padding: 8px 6px;
}
.chest-card {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.loot-list {
  text-align: left;
  margin: 14px 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.loot-item {
  background: #090f24;
  border: 1px solid var(--p2);
  padding: 8px 10px;
  border-radius: 4px;
  font-size: 11px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
</style>
</head>
<body>
<script src="galaxy.js"></script>
<script>
const R=(x,y,w,h,c)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
const S=b=>`<svg viewBox="0 0 16 16" shape-rendering="crispEdges">${b}</svg>`;
const chestSpr=(c,o)=>S(R(2,5,12,10,c[0])+R(3,6,10,8,c[1])+R(5,7,6,6,c[2])+R(1,7,2,6,c[3])+R(13,7,2,6,c[3])+(o?R(3,5,10,2,'#111')+R(4,2,8,3,c[3])+R(6,1,4,2,'#fff'):R(2,2,12,4,c[0])+R(3,3,10,2,c[1])+R(7,4,2,2,'#ffd23f')));

const CHESTS=[
 {
   n:'Cofre Común',kind:'comun',kn:'Común',c:['#1e293b','#334155','#64748b','#94a3b8'],
   desc:'Contiene suministros esenciales de colonización.',
   loot:[
     ['🔮 Plasma (PL)', '1K · 2.5K · 5K (55% acum.)'],
     ['💥 Supernova (NS)', '1K · 2.5K · 5K (30% acum.)'],
     ['🗝️ Llave Común', 'x1 Llave adicional (25%)'],
     ['🏪 Espacio de Mercado', '+1 Slot para tu Tienda (15%)'],
     ['💰 Créditos (CR)', '250 a 750 CR (100%)']
   ]
 },
 {
   n:'Cofre Básico',kind:'basico',kn:'Básica',c:['#064e3b','#047857','#10b981','#34d399'],
   desc:'Lote de minerales y recursos estandarizados, con una recompensa extra.',
   loot:[
     ['💰 Créditos base (CR)', '1.5K a 3.5K CR (siempre)'],
     ['🔮 Plasma base (PL)', '3K a 6K PL (siempre)'],
     ['🔮 Orbes extra (ORB)', '150K · 350K · 550K'],
     ['💰 Créditos extra (CR)', '100K · 250K · 500K'],
     ['🪄 Varita de Venta x1', '1 unidad'],
     ['🗝️ Llaves extra', '2 Comunes · 1 Básica'],
     ['🏪 Espacios de Mercado', '+2 espacios']
   ]
 },
 {
   n:'Cofre Especial',kind:'especial',kn:'Especial',c:['#1e3a8a','#1d4ed8','#3b82f6','#60a5fa'],
   desc:'Cápsula con tecnología espacial intermedia.',
   loot:[
     ['💰 Créditos (CR)', '5K a 13K CR (100%)'],
     ['🔮 Plasma (PL)', '8K a 14K PL (100%)'],
     ['🔮 Orbes (ORB)', '+50 Orbes (100%)']
   ]
 },
 {
   n:'Cofre Raro',kind:'raro',kn:'Rara',c:['#581c87','#7e22ce','#a855f7','#c084fc'],
   desc:'Extracción de núcleos volcánicos concentrados.',
   loot:[
     ['💰 Créditos (CR)', '20K CR (100%)'],
     ['🔮 Plasma (PL)', '25K PL (100%)'],
     ['🔮 Orbes (ORB)', '+200 Orbes (100%)']
   ]
 },
 {
   n:'Cofre Épico',kind:'epico',kn:'Épica',c:['#831843','#be185d','#ec4899','#f472b6'],
   desc:'Artefacto cósmico con energía primordial.',
   loot:[
     ['💰 Créditos (CR)', '100K CR (100%)'],
     ['🔮 Plasma (PL)', '100K PL (100%)'],
     ['🔮 Orbes (ORB)', '+1K Orbes (100%)'],
     ['💥 Supernova (NS)', '+10K Supernova (100%)']
   ]
 },
 {
   n:'Cofre de Evento',kind:'evento',kn:'de Evento',c:['#78350f','#d97706','#ffd23f','#ffffff'],
   desc:'La cápsula suprema de mayor valor del sector.',
   loot:[
     ['💰 Créditos (CR)', '500K CR (100%)'],
     ['🔮 Plasma (PL)', '500K PL (100%)'],
     ['🔮 Orbes (ORB)', '+5K Orbes (100%)'],
     ['💥 Supernova (NS)', '+50K Supernova (100%)']
   ]
 }
];

let KEYS = {};
let ODDS_BASICO = [];

startPage({active:'lobby.html', onState});

$('view').innerHTML = `
  <div id="planetArea" style="width:100%"></div>
  <div style="width:100%">
    <h2 class="sec-title px">📦 CÁPSULAS DE SUMINISTRO</h2>
    <div class="notice" style="width:100%;margin:0 0 14px;font-size:9.5px">
      🗝️ Toca el cofre para ver su <b>contenido y probabilidades</b>. Pulsa <b>Abrir</b> si tienes la llave requerida.
    </div>
    <div class="row" id="chestGrid"></div>
  </div>
  <div class="modal" id="modalChest" hidden onclick="if(event.target===this)this.hidden=true">
    <div class="modal-box" id="modalChestBox" style="max-width:480px"></div>
  </div>`;

renderChests(); 
loadKeys(); 
loadOdds();
setInterval(loadKeys, 6000);

let lastKey = null;
function onState(s){
  if (!s) return;
  const key = JSON.stringify([s.planet && s.planet.code, s.my_requests]);
  if (key === lastKey) return;
  const hadNoPlanet = lastKey !== null && JSON.parse(lastKey)[0] === null;
  lastKey = key;

  if (s.planet) {
    if (hadNoPlanet) toast('🪐 ¡Ya perteneces a un planeta!');
    $('planetArea').innerHTML = `
      <div class="box">
        <div class="box-title px">🪐 ${esc(s.planet.name)}</div>
        <a class="btn" style="display:block;text-decoration:none" href="planeta.html">Ir a Mi Planeta</a>
      </div>`;
    return;
  }

  const pend = (s.my_requests || []).map(r => 
    `⏳ Solicitud enviada a <b>${esc(r.planet_name)}</b> (${esc(r.code)}). Esperando respuesta del comandante.`
  ).join('<br>');

  $('planetArea').innerHTML = `
    <div class="box">
      <div class="box-title px">📡 NO TIENES PLANETA ASIGNADO</div>
      <div class="two">
        <button class="btn" onclick="showPanel('Create')">🪐 Crear Planeta</button>
        <button class="btn alt" onclick="showPanel('Join')">🚀 Unirme a un Planeta</button>
      </div>
      <div class="panel" id="panelCreate" hidden>
        <h3 class="px">NOMBRA TU PLANETA</h3>
        <input class="input" id="newName" maxlength="20" placeholder="Nombre (ej. Kepler-45)">
        <button class="btn ok" id="btnCreate" onclick="createPlanet()">Aceptar</button>
      </div>
      <div class="panel" id="panelJoin" hidden>
        <h3 class="px">CÓDIGO DEL PLANETA</h3>
        <input class="input" id="joinCode" maxlength="12" placeholder="Código (ej. PL-7K9AB)">
        <button class="btn alt" id="btnJoin" onclick="joinPlanet()">Enviar Solicitud</button>
      </div>
      ${pend ? `<div class="notice">${pend}</div>` : ''}
    </div>`;
}

function showPanel(w){ 
  $('panelCreate').hidden = w !== 'Create'; 
  $('panelJoin').hidden = w !== 'Join'; 
}

async function createPlanet(){
  const btn = $('btnCreate'); btn.disabled = true;
  const { data, error } = await db.rpc('galaxy_create_planet', { p_user_id: me.id, p_name: $('newName').value.trim() });
  btn.disabled = false;
  if (error) return toast('Error: ' + error.message);
  if (!data.success) return toast('❌ ' + data.msg);
  toast('🪐 ¡Planeta fundado!'); 
  lastKey = null; 
  await refresh();
}

async function joinPlanet(){
  const btn = $('btnJoin'); btn.disabled = true;
  const { data, error } = await db.rpc('galaxy_request_join', { p_user_id: me.id, p_code: $('joinCode').value.trim().toUpperCase() });
  btn.disabled = false;
  if (error) return toast('Error: ' + error.message);
  if (!data.success) return toast('❌ ' + data.msg);
  toast('📨 ' + data.msg); 
  lastKey = null; 
  await refresh();
}

async function loadKeys(){
  if (document.hidden) return;
  try {
    const { data } = await db.rpc('galaxy_get_keys', { p_user_id: me.id });
    if (data && data.success) { 
      KEYS = data.keys; 
      paintKeys(); 
    }
  } catch(e){}
}

async function loadOdds(){
  try {
    const { data } = await db.rpc('galaxy_chest_rewards_get', { p_chest_kind: 'basico' });
    if (data && data.success && Array.isArray(data.rewards)) {
      ODDS_BASICO = data.rewards;
    }
  } catch(e){}
}

function paintKeys(){ 
  CHESTS.forEach((c, i) => { 
    const count = Number(KEYS[c.kind] || 0);
    const el = $('kq' + i); 
    const btn = $('btnOpen' + i);
    if (el) el.textContent = fmt(count); 
    if (btn) {
      btn.disabled = count < 1;
      btn.textContent = count >= 1 ? 'Abrir Cofre' : 'Sin Llave';
    }
  }); 
}

function renderChests(){
  $('chestGrid').innerHTML = CHESTS.map((c, i) => `
    <div class="card chest-card">
      <div class="chest" id="chestSpr${i}" onclick="showChestInfo(${i})" title="Toca para ver el contenido">
        ${chestSpr(c.c, 0)}
      </div>
      <h3 style="color:${c.c[3]};margin:8px 0 4px">${c.n}</h3>
      <p style="margin:0">🗝️ Llave ${c.kn}<br><b style="color:var(--gold)">x<span id="kq${i}">0</span></b></p>
      <button class="btn ok chest-btn-open" id="btnOpen${i}" disabled onclick="openChestByIdx(${i})">
        Sin Llave
      </button>
    </div>`).join('');
}

function showChestInfo(i) {
  const c = CHESTS[i];
  const count = Number(KEYS[c.kind] || 0);
  $('modalChestBox').innerHTML = `
    <h3 class="px" style="color:${c.c[3]};margin-bottom:8px">${c.n}</h3>
    <p style="font-size:11px;color:var(--m);margin-bottom:12px">${c.desc}</p>
    <div class="notice" style="margin:0 0 10px;font-size:9.5px">
      Llaves disponibles: <b style="color:var(--gold)">${fmt(count)}</b>
    </div>
    <div class="loot-list">
      ${c.loot.map(l => `
        <div class="loot-item">
          <span>${l[0]}</span>
          <b style="color:var(--g)">${l[1]}</b>
        </div>`).join('')}
    </div>
    ${i === 1 && ODDS_BASICO.length ? `
      <div class="notice" style="margin:0 0 10px;font-size:9.5px;line-height:1.8">
        <b>PROBABILIDAD DE LA RECOMPENSA EXTRA</b><br>
        ${ODDS_BASICO.map(o => `${esc(o.label)}: <b>${o.chance_pct}%</b>`).join('<br>')}
        <br><small style="color:var(--m)">Configurado en Supabase · tabla galaxy_chest_rewards</small>
      </div>` : ''}
    <button class="btn ok" style="margin-bottom:8px" ${count < 1 ? 'disabled' : ''} onclick="$('modalChest').hidden=true; openChestByIdx(${i})">
      ${count >= 1 ? '🔓 Abrir 1 Cápsula' : '🔒 Requiere 1 Llave ' + c.kn}
    </button>
    <button class="btn alt" onclick="$('modalChest').hidden=true">Cerrar</button>`;
  $('modalChest').hidden = false;
}

let opening = false;

function newChestRequestId(){
  try {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
  } catch(e){}
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, ch => {
    const r = Math.random() * 16 | 0;
    const v = ch === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

async function openChestByIdx(i){
  if (opening) return;
  const c = CHESTS[i];
  const count = Number(KEYS[c.kind] || 0);
  if (count < 1) return toast(`🗝️ Necesitas una Llave ${c.kn}`);
  
  const sprEl = $('chestSpr' + i);
  opening = true; 
  if (sprEl) sprEl.classList.add('shake');

  // Mismo request_id si se reintenta la misma apertura: el servidor no
  // vuelve a cobrar la llave ni a entregar la recompensa.
  const pendingKey = 'galaxy_chest_req_' + i;
  let requestId = localStorage.getItem(pendingKey);
  if (!requestId) {
    requestId = newChestRequestId();
    localStorage.setItem(pendingKey, requestId);
  }

  const { data, error } = await db.rpc('galaxy_open_chest_v2', {
    p_user_id: me.id,
    p_chest: i,
    p_session_hash: SESSION_HASH,
    p_request_id: requestId
  });
  await new Promise(r => setTimeout(r, 450));

  if (error || !data || !data.success) { 
    opening = false; 
    if (sprEl) sprEl.classList.remove('shake'); 
    return toast('❌ ' + (data ? data.msg : 'Error al abrir cofre')); 
  }

  localStorage.removeItem(pendingKey);

  if (sprEl) sprEl.innerHTML = chestSpr(c.c, 1);
  KEYS = data.keys; 
  paintKeys();
  applyState(Object.assign({}, state, { user: data.user }));

  const r = data.reward || {};
  const parts = [];
  if (r.cr) parts.push('+' + fmt(r.cr) + ' CR'); 
  if (r.extra && r.extra.kind === 'credits') parts.push('💰 Extra: +' + fmt(r.extra.amount) + ' CR');
  if (r.pl) parts.push('+' + fmt(r.pl) + ' PL');
  if (r.ec) parts.push('+' + fmt(r.ec) + ' ORB'); 
  if (r.ns) parts.push('+' + fmt(r.ns) + ' Supernova');
  if (r.wand) parts.push('🪄 ¡Varita de Venta x1!');
  if (r.key_comun) parts.push(`🗝️ +${fmt(r.key_comun)} Llave${r.key_comun === 1 ? '' : 's'} Común${r.key_comun === 1 ? '' : 'es'}`);
  if (r.key_basico) parts.push(`🗝️ +${fmt(r.key_basico)} Llave${r.key_basico === 1 ? '' : 's'} Básica${r.key_basico === 1 ? '' : 's'}`);
  if (r.market_slots) parts.push(`🏪 +${fmt(r.market_slots)} Espacio${r.market_slots === 1 ? '' : 's'} de Mercado`);
  if (r.refund_key) parts.push('🗝️ ¡+1 Llave devuelta!');

  toast(`📦 ${c.n}: ${parts.join(' · ')}`);

  if (r.wand || r.sales_multiplier || r.market_slots) syncWandStatus();

  setTimeout(() => { 
    if (sprEl) {
      sprEl.classList.remove('shake'); 
      sprEl.innerHTML = chestSpr(c.c, 0); 
    }
    opening = false; 
  }, 1000);
}
</script>
</body>
</html>
