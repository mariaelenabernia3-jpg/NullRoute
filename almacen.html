<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Almacén // GalaxyGens</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="lobby.webp" type="image/webp" fetchpriority="high">
<link rel="stylesheet" href="galaxy.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<script src="galaxy.js"></script>
<script>
let G = null;

startPage({active:'almacen.html', needPlanet:true}).then(() => { 
  sync(); 
  setInterval(sync, 3000); 
});

$('view').innerHTML = '<div style="width:100%" id="whView"><div class="px" style="font-size:10px">Abriendo almacén...</div></div>';

async function sync(){
  if (document.hidden) return;
  try {
    const { data } = await db.rpc('galaxy_get_generators', { p_user_id: me.id, p_page: 'almacen' });
    if (!data || !data.success) return;
    G = data; 
    applyState(Object.assign({}, state, { user: data.user })); 
    render();
  } catch(e) {
    console.error('Error sincronizando almacén:', e);
  }
}

function render(){
  if (!G.has_warehouse) {
    $('whView').innerHTML = `
      <div class="box">
        <div style="font-size:48px">🔒</div>
        <div class="box-title px">ALMACÉN CON CANDADO</div>
        <p style="color:var(--m);font-size:13px;max-width:460px;margin:0 auto 16px">
          Automatiza la producción: tus generadores depositan los ítems solos y vendes todo con un clic.
          Si <b>un</b> miembro lo compra, se desbloquea para <b>todo el planeta</b>.
        </p>
        <div style="max-width:300px;margin:auto">
          <button class="btn" style="background:var(--gold)" onclick="buy()">Comprar · 300 CR</button>
        </div>
      </div>`;
    return;
  }

  const total = Number(G.warehouse_total || 0);
  $('whView').innerHTML = `
    <div class="wh-head">
      <h2 class="sec-title px" style="margin:0">📦 ALMACÉN DEL PLANETA</h2>
      <button class="btn ok" ${total > 0 ? '' : 'disabled'} onclick="sellAll()">VENDER TODO · +${fmt(total)} CR</button>
    </div>
    <div class="box" style="text-align:left;padding:12px">
      ${(G.warehouse && G.warehouse.length) ? `
        <table class="wh-table">
          <tr><th>ÍTEM</th><th>GEN.</th><th>VALOR</th><th>CANT.</th><th>ACCIÓN</th></tr>
          ${G.warehouse.map(w => {
            const itemTotal = w.qty * w.value;
            return `
              <tr>
                <td>${w.rarity === 'rare' ? '✨' : '🪨'} ${esc(w.name)}</td>
                <td>Nv.${w.level}</td>
                <td style="color:var(--gold)">${w.value} CR</td>
                <td><b>${fmt(w.qty)}</b></td>
                <td>
                  <button class="btn ok sm" onclick="sellItem(${w.level}, '${w.rarity}')">
                    Vender · +${fmt(itemTotal)} CR
                  </button>
                </td>
              </tr>`;
          }).join('')}
        </table>` 
        : '<div class="px" style="font-size:10px;color:var(--m);text-align:center;padding:14px">Vacío · los generadores encendidos depositan aquí cada 10 s</div>'
      }
    </div>
    <div class="notice" style="width:100%">⚠️ Puedes vender lotes individuales o vaciar todo el almacén. Máximo 4 miembros por isla.</div>`;
}

async function buy(){
  const { data } = await db.rpc('galaxy_buy_warehouse', { p_user_id: me.id });
  if (!data || !data.success) return toast('❌ ' + (data ? data.msg : 'Error de conexión'));
  toast('📦 ¡Almacén desbloqueado para todo el planeta!'); 
  sync();
}

async function sellAll(){
  const { data } = await db.rpc('galaxy_sell_warehouse_v2', { p_user_id: me.id, p_session_hash: SESSION_HASH });
  if (!data || !data.success) { 
    toast('❌ ' + (data ? data.msg : 'Error de conexión')); 
    return sync(); 
  }
  toast('💰 +' + fmt(data.total) + ' CR' + (data.bonus > 0 ? ' · x' + data.multiplier : '')); 
  sync();
}

async function sellItem(level, rarity){
  const { data, error } = await db.rpc('galaxy_sell_warehouse_item_v2', { 
    p_user_id: me.id, 
    p_level: parseInt(level, 10), 
    p_rarity: String(rarity),
    p_session_hash: SESSION_HASH
  });
  if (error || !data || !data.success) { 
    toast('❌ ' + (data ? data.msg : (error ? error.message : 'Error al vender'))); 
    return sync(); 
  }
  toast('💰 +' + fmt(data.total) + ' CR' + (data.bonus > 0 ? ' · x' + data.multiplier : '')); 
  sync();
}
</script>
</body>
</html>
