<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alistamiento // GalaxyGens</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="lobby.webp" type="image/webp" fetchpriority="high">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#050713;--p:#0e1329;--p2:#182042;--g:#00f2fe;--gd:#4facfe;--t:#e8eeff;--m:#8ca0d1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.6 system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(rgba(5,7,19,.8),rgba(5,7,19,.9)),url('lobby.webp') center/cover fixed no-repeat,#050713}
h1,h2,.px{font-family:'Press Start 2P',monospace,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:#090d1fdd;border-bottom:3px solid var(--gd)}
.logo{color:var(--g);text-decoration:none;font-size:13px}
.wrap{max-width:420px;margin:auto;padding:20px;width:100%}
.card{background:var(--p);border:3px solid var(--p2);padding:24px;box-shadow:0 0 25px rgba(0,242,254,0.15)}
h2{font-size:14px;color:var(--g);margin:0 0 18px}
label{display:block;font-size:11px;margin:12px 0 6px;color:var(--m);font-family:'Press Start 2P',monospace}
input{width:100%;padding:10px;background:#060817;border:3px solid var(--p2);color:var(--t);font-size:14px}
input:focus{border-color:var(--g);outline:none}
.btn{font:11px 'Press Start 2P',monospace;background:var(--g);color:#030b1e;border:0;padding:12px;cursor:pointer;width:100%;margin-top:16px}
.btn:hover{filter:brightness(1.2)}.btn:disabled{opacity:.5;cursor:not-allowed}
.err{color:#ff6b8b;font-size:11px;min-height:20px;margin-top:8px;font-family:'Press Start 2P',monospace}
.small{font-size:12px;color:var(--m);margin-top:16px;text-align:center}
.small a{color:var(--g);text-decoration:none}
</style>
</head>
<body>

<div class="top">
  <a class="logo px" href="index.html">GALAXYGENS</a>
  <a href="index.html" style="color:var(--m);font-size:11px;font-family:'Press Start 2P',monospace;text-decoration:none">← Inicio</a>
</div>

<div class="wrap">
  <div class="card">
    <h2 class="px">NUEVO COMANDANTE</h2>
    <form id="f">
      <label>Identificador de Piloto</label>
      <input id="u" required minlength="2" maxlength="25" autocomplete="username" placeholder="ej. Cmdr Juan 77">
      
      <label>Frecuencia de Seguridad</label>
      <input id="pw" type="password" required minlength="4" autocomplete="new-password">
      
      <label>Confirmar Frecuencia</label>
      <input id="pw2" type="password" required>
      
      <div class="err" id="e"></div>
      <button class="btn" id="subBtn">Registrar en la Flota</button>
    </form>
    <p class="small">¿Ya tienes rango? <a href="login.html">Entra al Hangar</a></p>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://ndsapciemgudjkfefjcf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_5fsPp1mJiOlYBZ0PpEz5zg_UCs4X8nF';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const u = document.getElementById('u').value.trim();
  const p = document.getElementById('pw').value;
  const p2 = document.getElementById('pw2').value;
  const er = document.getElementById('e');
  const btn = document.getElementById('subBtn');

  if (p !== p2) { er.textContent = 'Las contraseñas no coinciden.'; return; }

  er.textContent = 'Registrando comandante...';
  btn.disabled = true;

  try {
    const { data, error } = await db.rpc('galaxy_register', { p_username: u, p_password: p });
    btn.disabled = false;

    if (error) { er.textContent = 'Error: ' + error.message; return; }
    if (!data.success) {
      er.textContent = data.msg;
    } else {
      localStorage.setItem('galaxy_session_user', JSON.stringify(data.user));
      window.location.href = 'lobby.html';
    }
  } catch (err) {
    btn.disabled = false;
    er.textContent = 'Error de conexión con el sector.';
  }
};
</script>
</body>
</html>
